<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14123a">
<title>Predicciones en familia</title>
<style>
  :root{
    --bg1:#12102f;--bg2:#2b1457;--gold:#ffd166;--pink:#ff5d8f;--orange:#ff9b54;
    --ok1:#2ecc8f;--ok2:#12a06b;--ko1:#ff6b6b;--ko2:#d63a4a;
    --glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.16);--ink:#f6f2ff;--mut:#b9b0d6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#46186b);background-attachment:fixed;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 60px}

  h1{font-size:1.7rem;margin:.1em 0;line-height:1.1;font-weight:800;
     background:linear-gradient(90deg,var(--gold),var(--pink),var(--gold));background-size:200% auto;
     -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
  h2{font-size:1.05rem;margin:1.6em 0 .5em;color:var(--gold);letter-spacing:.02em}
  @keyframes shine{to{background-position:200% center}}
  .mut{color:var(--mut);font-size:.9rem}
  .hero{text-align:center;padding:26px 0 8px}
  .hero .big{font-size:3.2rem;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}

  .card{
    background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .anim .card,.anim .chip{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .pred{font-size:1.05rem;line-height:1.35}
  .who{font-size:.8rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}

  input,textarea{
    width:100%;padding:13px 14px;margin:5px 0;color:var(--ink);font:inherit;
    background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;outline:none;transition:.2s;
  }
  input::placeholder,textarea::placeholder{color:#9d93c2}
  input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,102,.2)}

  button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;margin:3px 0;color:#fff;cursor:pointer;
    transition:transform .15s,box-shadow .2s,filter .2s;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  button:active{transform:scale(.94)}
  button:disabled{opacity:.4;pointer-events:none}
  .btn{background:linear-gradient(135deg,var(--pink),var(--orange))}
  .btn:hover{filter:brightness(1.1);box-shadow:0 8px 22px rgba(255,93,143,.45)}
  .btn.block{width:100%;font-size:1.05rem;padding:14px}
  .btn.pulse{animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,143,.6)}70%{box-shadow:0 0 0 14px rgba(255,93,143,0)}100%{box-shadow:0 0 0 0 rgba(255,93,143,0)}}
  .ghost{background:rgba(255,255,255,.12);box-shadow:none;padding:9px 14px;font-weight:600}
  .yes{background:linear-gradient(135deg,var(--ok1),var(--ok2))}
  .no{background:linear-gradient(135deg,var(--ko1),var(--ko2))}
  .vote{flex:1;font-size:1.05rem;opacity:.55;transform:scale(.97)}
  .vote.sel{opacity:1;transform:scale(1.03);box-shadow:0 0 0 3px #fff,0 8px 24px rgba(0,0,0,.4)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .between{justify-content:space-between}

  .tag{display:inline-block;font-size:.78rem;font-weight:700;padding:4px 11px;border-radius:99px;
       background:rgba(255,209,102,.16);color:var(--gold);border:1px solid rgba(255,209,102,.4)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:.82rem;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.1)}
  .chip.done{background:linear-gradient(135deg,var(--ok1),var(--ok2))}
  .lock{color:var(--gold);font-weight:700}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));border-radius:99px;transition:width .5s}

  .rank{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .rank:last-child{border:0}
  .pos{font-size:1.5rem;width:36px;text-align:center}
  .rank .nm{flex:1;font-weight:700}
  .rank .dt{font-size:.78rem;color:var(--mut)}
  .rank .pts{font-size:1.5rem;font-weight:800;color:var(--gold)}
  .res{font-weight:700;margin-top:6px}
  .admin{border:1px dashed var(--line);border-radius:16px;padding:6px 12px;margin-top:10px}
  .card.pend{border-color:rgba(255,209,102,.6)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--glass)}
  table.m{border-collapse:collapse;width:100%;font-size:.88rem}
  table.m th,table.m td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  table.m th{color:var(--gold);font-weight:700}
  table.m td.q,table.m th.q{text-align:left;white-space:normal;min-width:190px;position:sticky;left:0;z-index:1;background:#2a1458}
  table.m td.ok{background:rgba(46,204,143,.3)} table.m td.ko{background:rgba(255,107,107,.3)}
  table.m td.me,table.m th.me{box-shadow:inset 0 0 0 2px var(--gold)}
  details.adv{margin-top:10px} details.adv summary{color:var(--mut);font-size:.85rem;cursor:pointer}
  canvas.confetti{position:fixed;inset:0;z-index:50;pointer-events:none}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main id="app">Cargando…</main>

<script type="module">
/* ====== 1) PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT ====== */
/* Termina en /exec. Si la dejas vacía, la app funciona en MODO LOCAL (datos solo en este móvil). */
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbylsVdIrLVYSr37X_l6EKEofWG3jiZiNj0h1QC5nF-fpZOY30gU55G04HgtH2LExFKu9Q/exec";
/* ============================================================================ */

const LOCAL = !SHEETS_URL;

function makeSheets(url){
  let cache = {}, last = "", pending = 0;
  const listeners = new Set();
  const notify = () => listeners.forEach(f => f());
  const snapDoc = (id, data) => ({id, exists: () => data !== undefined, data: () => data});
  async function pull(){
    if(pending > 0) return;
    try{
      const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now());
      const j = await r.json(); if(pending > 0) return;
      const n = {}; j.rows.forEach(x => { (n[x.c] = n[x.c] || {})[x.id] = x.data; });
      const s = JSON.stringify(n);
      if(s !== last){ cache = n; last = s; notify(); }
    }catch(e){ console.warn("Sin conexión con la hoja", e); }
  }
  const send = async body => {
    pending++;
    try{ await fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)}); }
    finally{ pending--; }
    await pull();
  };
  const setDoc = async (r, data, opt) => {
    const merge = !!(opt && opt.merge);
    cache[r.c] = cache[r.c] || {};
    cache[r.c][r.id] = merge ? {...cache[r.c][r.id], ...data} : data; notify();
    await send({op: merge ? "merge" : "set", c: r.c, id: r.id, data});
  };
  pull(); setInterval(pull, 4000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) pull(); });
  return {
    db: {},
    collection: (db, c) => ({c}),
    doc: (db, c, id) => ({c, id}),
    serverTimestamp: () => ({seconds: Math.floor(Date.now()/1000)}),
    setDoc,
    getDoc: async r => { await pull(); return snapDoc(r.id, (cache[r.c] || {})[r.id]); },
    addDoc: async (r, data) => setDoc({c: r.c, id: crypto.randomUUID()}, data),
    deleteDoc: async r => { if(cache[r.c]) delete cache[r.c][r.id]; notify(); await send({op:"delete", c:r.c, id:r.id}); },
    updateDoc: async (r, data) => setDoc(r, data, {merge: true}),
    onSnapshot: (r, cb) => {
      const fire = () => {
        const col = cache[r.c] || {};
        if(r.id) cb(snapDoc(r.id, col[r.id]));
        else cb({docs: Object.entries(col).map(([id, d]) => ({id, data: () => d}))});
      };
      listeners.add(fire); fire(); return () => listeners.delete(fire);
    }
  };
}

function makeLocal(){
  const listeners = new Set();
  const load = () => JSON.parse(localStorage.getItem("localdb") || "{}");
  const save = d => { localStorage.setItem("localdb", JSON.stringify(d)); listeners.forEach(f => f()); };
  const snapDoc = (id, data) => ({id, exists: () => data !== undefined, data: () => data});
  const setDoc = async (r, data, opt) => {
    const d = load(); d[r.c] = d[r.c] || {};
    d[r.c][r.id] = opt && opt.merge ? {...d[r.c][r.id], ...data} : data; save(d);
  };
  return {
    db: {},
    collection: (db, c) => ({c}),
    doc: (db, c, id) => ({c, id}),
    serverTimestamp: () => ({seconds: Math.floor(Date.now()/1000)}),
    setDoc,
    getDoc: async r => snapDoc(r.id, (load()[r.c] || {})[r.id]),
    addDoc: async (r, data) => setDoc({c: r.c, id: crypto.randomUUID()}, data),
    deleteDoc: async r => { const d = load(); if(d[r.c]) delete d[r.c][r.id]; save(d); },
    updateDoc: async (r, data) => setDoc(r, data, {merge: true}),
    onSnapshot: (r, cb) => {
      const fire = () => {
        const col = load()[r.c] || {};
        if(r.id) cb(snapDoc(r.id, col[r.id]));
        else cb({docs: Object.entries(col).map(([id, d]) => ({id, data: () => d}))});
      };
      listeners.add(fire); fire(); return () => listeners.delete(fire);
    }
  };
}

const F = LOCAL ? makeLocal() : makeSheets(SHEETS_URL);
const {collection,doc,setDoc,getDoc,addDoc,deleteDoc,updateDoc,onSnapshot,serverTimestamp} = F;
const db = F.db;

const MAX_PREDS = 3;
const app = document.getElementById("app");

/* Un "grupo" es una familia: todos sus datos viven bajo el prefijo "<grupo>:" */
let group = JSON.parse(localStorage.getItem("group") || "null");
let me = group ? JSON.parse(localStorage.getItem("me:"+group.id) || "null") : null;
let isAdmin = group ? sessionStorage.getItem("admin:"+group.id) === "1" : false;
let users = [], preds = [], votes = [], groupDoc = null;
let state = {phase:"predicciones", year:new Date().getFullYear()+1};
let lastKey = "", celebrated = false, unsubs = [], gmode = "join", editingId = null;
const col = n => collection(db, group.id+":"+n);
const dc = (n,id) => doc(db, group.id+":"+n, id);

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const val = id => (document.getElementById(id)?.value || "").trim();
async function hash(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("fam-pred:"+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* ---- Fondo de estrellas ---- */
(function stars(){
  const c = document.getElementById("stars"), x = c.getContext("2d");
  let w, h, pts = [];
  const resize = () => { w = c.width = innerWidth; h = c.height = innerHeight;
    pts = Array.from({length: Math.round(w*h/9000)}, () => ({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5+.3, p:Math.random()*6.28, s:.01+Math.random()*.03})); };
  addEventListener("resize", resize); resize();
  (function loop(){
    x.clearRect(0,0,w,h);
    pts.forEach(p => { p.p += p.s; x.globalAlpha = .25 + .6*Math.abs(Math.sin(p.p)); x.fillStyle = "#fff"; x.beginPath(); x.arc(p.x,p.y,p.r,0,6.28); x.fill(); });
    requestAnimationFrame(loop);
  })();
})();

/* ---- Confeti ---- */
function confetti(n = 140){
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#ffd166","#ff5d8f","#ff9b54","#2ecc8f","#6ec5ff","#c79bff"];
  const ps = Array.from({length:n}, () => ({x:innerWidth/2, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-3,
    g:.3, r:Math.random()*6+3, a:Math.random()*6, va:(Math.random()-.5)*.4, col:cols[Math.random()*cols.length|0], life:1}));
  (function loop(){
    x.clearRect(0,0,c.width,c.height); let alive = false;
    ps.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= .006;
      if(p.life > 0 && p.y < c.height + 20){ alive = true; x.save(); x.globalAlpha = Math.max(p.life,0); x.translate(p.x,p.y); x.rotate(p.a);
        x.fillStyle = p.col; x.fillRect(-p.r, -p.r/2, p.r*2, p.r); x.restore(); } });
    alive ? requestAnimationFrame(loop) : c.remove();
  })();
}

/* ---- Suscripciones en tiempo real (solo del grupo activo) ---- */
function subscribe(){
  unsubs.forEach(u => u()); unsubs = [];
  users = []; preds = []; votes = []; groupDoc = null;
  state = {phase:"predicciones", year:new Date().getFullYear()+1};
  if(!group) return;
  const subs = [
    onSnapshot(col("users"), s => { users = s.docs.map(d=>({id:d.id,...d.data()})); render(); }),
    onSnapshot(col("predictions"), s => { preds = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)); render(); }),
    onSnapshot(col("votes"), s => { votes = s.docs.map(d=>({id:d.id,...d.data()})); render(); }),
    onSnapshot(dc("config","state"), s => { if(s.exists()) state = {...state,...s.data()}; render(); }),
    onSnapshot(doc(db,"groups",group.id), s => { groupDoc = s.exists() ? s.data() : null; render(); })
  ];
  unsubs = subs;
}

/* ---- Puntuación ---- */
function scores(){
  return users.map(u=>{
    const mine = preds.filter(p=>p.userId===u.id);
    const ownHit = mine.filter(p=>p.outcome===true).length;
    const ownMiss = mine.filter(p=>p.outcome===false).length;
    let voteHit=0, voteMiss=0;
    votes.filter(v=>v.userId===u.id).forEach(v=>{
      const p = preds.find(x=>x.id===v.predId);
      if(!p || typeof p.outcome!=="boolean") return;
      (v.vote===p.outcome) ? voteHit++ : voteMiss++;
    });
    return {name:u.name, ownHit, ownMiss, voteHit, voteMiss, total: ownHit+voteHit};
  }).sort((a,b)=>b.total-a.total);
}

/* ---- Grupos ---- */
function enterGroup(g){
  group = g; localStorage.setItem("group", JSON.stringify(g));
  me = JSON.parse(localStorage.getItem("me:"+g.id) || "null");
  isAdmin = sessionStorage.getItem("admin:"+g.id) === "1";
  lastKey = ""; subscribe(); render();
}
window.setGmode = m => { gmode = m; render(); };
window.createGroup = async () => {
  const name = val("gn"), pin = val("gp"), adm = val("ga"), id = slug(name);
  if(!id) return alert("Pon un nombre para el grupo (con letras o números).");
  if(pin.length<4) return alert("El PIN del grupo necesita al menos 4 caracteres.");
  if(adm.length<4) return alert("El código de organizador necesita al menos 4 caracteres.");
  if((await getDoc(doc(db,"groups",id))).exists()) return alert("Ya existe un grupo con ese nombre. Elige otro o entra en él.");
  await setDoc(doc(db,"groups",id), {name, pinHash: await hash("group:"+id+":"+pin), adminHash: await hash("admin:"+id+":"+adm), createdAt: serverTimestamp()});
  enterGroup({id,name});
};
window.joinGroup = async () => {
  const name = val("gn"), pin = val("gp"), id = slug(name);
  if(!id || !pin) return alert("Escribe el nombre del grupo y su PIN.");
  const snap = await getDoc(doc(db,"groups",id));
  if(!snap.exists() || snap.data().pinHash !== await hash("group:"+id+":"+pin)) return alert("Nombre de grupo o PIN incorrectos.");
  enterGroup({id, name: snap.data().name});
};
window.leaveGroup = () => {
  group = null; me = null; isAdmin = false; localStorage.removeItem("group");
  lastKey = ""; subscribe(); render();
};

/* ---- Acciones ---- */
window.login = async () => {
  const name = val("n"), pin = val("p");
  if(!name || pin.length<4) return alert("Pon tu nombre y un PIN de al menos 4 caracteres.");
  const id = slug(name); if(!id) return alert("El nombre debe tener letras o números.");
  const ref = dc("users",id), h = await hash(pin), snap = await getDoc(ref);
  if(snap.exists()){
    if(snap.data().pinHash !== h) return alert("Ese nombre ya existe en el grupo y el PIN no coincide.");
  } else {
    await setDoc(ref,{name,pinHash:h,published:false,createdAt:serverTimestamp()});
  }
  me = {id,name}; localStorage.setItem("me:"+group.id,JSON.stringify(me)); render();
};
window.logout = () => { localStorage.removeItem("me:"+group.id); sessionStorage.removeItem("admin:"+group.id); me=null; isAdmin=false; render(); };

const askDup = (t, exceptId) => {
  const n = norm(t), words = new Set(n.split(" ").filter(w=>w.length>3));
  const dup = preds.find(p=>{
    if(p.id===exceptId) return false;
    if(!(p.userId===me.id || pubIds().has(p.userId))) return false;
    const m = norm(p.text); if(m===n || m.includes(n) || n.includes(m)) return true;
    const w2 = new Set(m.split(" ").filter(w=>w.length>3)); const inter = [...words].filter(w=>w2.has(w)).length;
    const uni = new Set([...words,...w2]).size; return uni && inter/uni >= .6;
  });
  return !dup || confirm("Se parece mucho a esta predicción de "+dup.userName+":\n\n«"+dup.text+"»\n\n¿Guardarla igualmente?");
};
window.addPred = async () => {
  const t = val("t");
  if(!t) return;
  if(preds.filter(p=>p.userId===me.id).length>=MAX_PREDS) return alert("Máximo "+MAX_PREDS+" predicciones.");
  if(!askDup(t)) return;
  document.getElementById("t").value = "";
  await addDoc(col("predictions"),{userId:me.id,userName:me.name,text:t,outcome:null,createdAt:serverTimestamp()});
};
window.delPred = id => { if(confirm("¿Borrar esta predicción?")) deleteDoc(dc("predictions",id)); };
window.editPred = id => { editingId = id; render(); };
window.cancelEdit = () => { editingId = null; render(); };
window.savePred = async id => {
  const t = val("e");
  if(!t) return alert("La predicción no puede quedar vacía.");
  if(!askDup(t, id)) return;
  editingId = null;
  await updateDoc(dc("predictions",id),{text:t});
  await Promise.all(votes.filter(v=>v.predId===id).map(v=>deleteDoc(dc("votes",v.id))));
};
window.publish = async () => {
  if(!confirm("Al publicar, tus predicciones quedan visibles para todo el grupo. Podrás editarlas hasta que el organizador abra la votación. ¿Publicar?")) return;
  await updateDoc(dc("users",me.id),{published:true}); confetti();
};
window.vote = (predId,v) => setDoc(dc("votes",me.id+"_"+predId),{userId:me.id,predId,vote:v});
window.setPhase = p => setDoc(dc("config","state"),{phase:p},{merge:true});
window.setOutcome = (id,v) => updateDoc(dc("predictions",id),{outcome:v});
window.adminLogin = async () => {
  if(!groupDoc) return alert("No encuentro los datos del grupo. Recarga la página.");
  const code = prompt("Código de organizador de este grupo:");
  if(!code) return;
  if(await hash("admin:"+group.id+":"+code.trim()) !== groupDoc.adminHash) return alert("Código incorrecto.");
  isAdmin = true; sessionStorage.setItem("admin:"+group.id,"1"); render();
};

const pubIds = () => new Set(users.filter(u=>u.published).map(u=>u.id));
const PHASES = {predicciones:"1 · Predicciones", votacion:"2 · Votación", cerrada:"3 · Guardadas", resultados:"4 · Resultados"};
const PHASE_NAME = {predicciones:"🟢 Plazo de predicciones abierto", votacion:"🔒 Plazo cerrado · 🗳️ votación sí/no", cerrada:"🔒 Votación cerrada", resultados:"🏆 Resultados"};

/* Flujo del organizador: cada fase ofrece sus botones de avanzar o reabrir */
const FLOW = {
  predicciones: [{to:"votacion", label:"🔒 Cerrar plazo y abrir votación", main:true,
    msg:"Al cerrar el plazo nadie podrá añadir ni cambiar predicciones, y cada persona tendrá que votar Sí o No en las de los demás. ¿Cerrar el plazo?"}],
  votacion: [
    {to:"predicciones", label:"↩ Reabrir plazo de predicciones",
      msg:"¿Reabrir el plazo? Se podrán editar y añadir predicciones otra vez. Si alguien edita una predicción, se borran los votos que ya tenía."},
    {to:"cerrada", label:"🔒 Cerrar votación", main:true, msg:"¿Cerrar la votación? Se mostrará la tabla con las apuestas de cada uno."}],
  cerrada: [
    {to:"votacion", label:"↩ Reabrir votación", msg:"¿Reabrir la votación?"},
    {to:"resultados", label:"🏆 Pasar a resultados", main:true, msg:"¿Pasar a resultados? Hazlo cuando llegue el momento de comprobar las predicciones."}],
  resultados: [{to:"cerrada", label:"↩ Volver a «Votación cerrada»", msg:"¿Volver a la fase anterior?"}]
};
window.goPhase = async k => { const f = (FLOW[state.phase] || [])[k]; if(f && confirm(f.msg)) await window.setPhase(f.to); };

const voteStats = u => {
  const need = preds.filter(p=>p.userId!==u.id).length;
  const got = votes.filter(v=>v.userId===u.id && preds.some(p=>p.id===v.predId && p.userId!==u.id)).length;
  return {need, got, done: need>0 && got>=need};
};

/* Tabla: una fila por predicción y una columna por persona con su apuesta */
function matrix(showRes){
  if(!preds.length) return `<p class="mut">No hay predicciones.</p>`;
  const vm = new Map(votes.map(v => [v.userId+"|"+v.predId, v.vote]));
  const mine = u => me && u.id===me.id ? "me" : "";
  const head = users.map(u=>`<th class="${mine(u)}">${esc(u.name)}</th>`).join("");
  const body = preds.map(p=>{
    let yes = 0, no = 0;
    const cells = users.map(u=>{
      if(u.id===p.userId) return `<td class="${mine(u)}" title="Autor">✍️</td>`;
      const v = vm.get(u.id+"|"+p.id);
      if(v===undefined) return `<td class="${mine(u)}">⏳</td>`;
      v ? yes++ : no++;
      const c = showRes && typeof p.outcome==="boolean" ? (v===p.outcome ? "ok" : "ko") : "";
      return `<td class="${c} ${mine(u)}">${v?"👍":"👎"}</td>`;
    }).join("");
    const res = p.outcome===true ? "✅" : p.outcome===false ? "❌" : "⏳";
    return `<tr><td class="q"><div class="who">${esc(p.userName)}</div>${esc(p.text)}</td>${cells}<td>${yes}👍 ${no}👎</td>${showRes?`<td>${res}</td>`:""}</tr>`;
  }).join("");
  return `<div class="scroll"><table class="m"><tr><th class="q">Predicción</th>${head}<th>Votos</th>${showRes?"<th>Resultado</th>":""}</tr>${body}</table></div>
    <p class="mut">✍️ autor · 👍 cree que se cumplirá · 👎 cree que no · ⏳ sin voto${showRes?" · verde = acertó · rojo = falló":""}</p>`;
}

/* ---- Vistas ---- */
function render(){
  const fields = ["n","p","t","e","gn","gp","ga"], saved = {}, focusId = document.activeElement && document.activeElement.id;
  fields.forEach(f => { const e = document.getElementById(f); if(e) saved[f] = e.value; });
  const restore = () => {
    for(const f in saved){ const e = document.getElementById(f); if(e) e.value = saved[f]; }
    if(focusId && saved[focusId] !== undefined){ const e = document.getElementById(focusId); if(e) e.focus(); }
  };
  const key = (group ? group.id : "-") + "|" + (me ? me.id : "login") + "|" + state.phase + "|" + gmode;
  const animate = key !== lastKey; lastKey = key;
  let i = 0; const st = () => `style="--i:${i++}"`;
  let h = "";
  const localBanner = LOCAL ? `<div class="card mut" ${st()}>Modo local: los datos se guardan solo en este móvil.</div>` : "";
  app.className = animate ? "anim" : "";

  /* 0) Elegir o crear grupo */
  if(!group){
    app.innerHTML = `<div class="hero"><div class="big">🎆</div><h1>Predicciones ${state.year}</h1>
      <p class="mut">Cena de fin de año en familia: ¿quién acierta más?</p></div>
      ${localBanner}
      <div class="row" style="justify-content:center" ${st()}>
        <button class="${gmode==="join"?"btn":"ghost"}" onclick="setGmode('join')">Entrar a mi grupo</button>
        <button class="${gmode==="create"?"btn":"ghost"}" onclick="setGmode('create')">Crear un grupo</button></div>
      ${gmode==="join" ? `<div class="card" ${st()}>
        <input id="gn" placeholder="Nombre del grupo" autocomplete="off"><input id="gp" type="password" placeholder="PIN del grupo">
        <button class="btn block pulse" onclick="joinGroup()">Entrar al grupo</button>
        <p class="mut" style="margin-bottom:0">Pídele el nombre y el PIN a quien creó el grupo.</p></div>`
      : `<div class="card" ${st()}>
        <input id="gn" placeholder="Nombre del grupo (ej.: Familia García)" autocomplete="off">
        <input id="gp" type="password" placeholder="PIN del grupo (se lo darás a tu familia)">
        <input id="ga" type="password" placeholder="Código de organizador (solo para ti)">
        <button class="btn block pulse" onclick="createGroup()">Crear grupo</button>
        <p class="mut" style="margin-bottom:0">Con el código de organizador abrirás la votación y marcarás los resultados.</p></div>`}`;
    restore(); return;
  }

  /* 1) Darse de alta / entrar en el grupo */
  if(!me){
    const shown = preds.filter(p => state.phase !== "predicciones" || pubIds().has(p.userId));
    app.innerHTML = `<div class="hero"><div class="big">🎆</div><h1>Predicciones ${state.year}</h1></div>
      ${localBanner}
      <div class="row between" ${st()}><span class="tag">👨‍👩‍👧 ${esc(group.name)}</span><button class="ghost" onclick="leaveGroup()">Cambiar de grupo</button></div>
      <div class="card" ${st()}><input id="n" placeholder="Tu nombre" autocomplete="off"><input id="p" type="password" placeholder="Tu PIN personal (mín. 4 caracteres)">
      <button class="btn block pulse" onclick="login()">Entrar / darme de alta</button>
      <p class="mut" style="margin-bottom:0">Si ya te diste de alta, usa el mismo nombre y PIN.</p></div>
      <h2>👀 Ya publicadas en el grupo (${shown.length})</h2>
      ${shown.length ? shown.map(p=>`<div class="card" ${st()}><div class="who">${esc(p.userName)}</div><div class="pred">${esc(p.text)}</div></div>`).join("")
        : `<p class="mut">Todavía nadie ha publicado. Cuando lo hagan las verás aquí para no repetirlas.</p>`}`;
    restore(); return;
  }

  const meUser = users.find(u=>u.id===me.id);
  const published = !!(meUser && meUser.published);
  const mine = preds.filter(p=>p.userId===me.id);
  const pub = pubIds();

  h += localBanner;
  h += `<div class="row between"><h1>🎆 Predicciones ${state.year}</h1><button class="ghost" onclick="logout()">Salir</button></div>
    <p class="mut">Hola, <b style="color:var(--ink)">${esc(me.name)}</b> · 👨‍👩‍👧 ${esc(group.name)} · ${users.length} participantes</p>
    <span class="tag">${PHASE_NAME[state.phase]}</span>`;

  /* FASE 1 */
  if(state.phase==="predicciones"){
    h += `<h2>Tus predicciones (${mine.length}/${MAX_PREDS}) ${published?'<span class="lock">✅ publicadas</span>':""}</h2>`;
    mine.forEach(p=>{
      h += editingId===p.id
        ? `<div class="card" ${st()}><textarea id="e" rows="2">${esc(p.text)}</textarea>
            <div class="row"><button class="btn" onclick="savePred('${p.id}')">💾 Guardar</button><button class="ghost" onclick="cancelEdit()">Cancelar</button></div></div>`
        : `<div class="card pred" ${st()}>${esc(p.text)}
            <div class="row" style="margin-top:8px"><button class="ghost" onclick="editPred('${p.id}')">✏️ Editar</button><button class="ghost" onclick="delPred('${p.id}')">🗑 Borrar</button></div></div>`;
    });
    if(mine.length<MAX_PREDS) h += `<div class="card" ${st()}><textarea id="t" rows="2" placeholder="Ej.: Canarias ganará su primera medalla olímpica…"></textarea>
      <button class="btn" onclick="addPred()">➕ Añadir predicción</button></div>`;
    if(!published){
      h += `<button class="btn block ${mine.length?"pulse":""}" ${mine.length?"":"disabled"} onclick="publish()">🚀 Publicar mis predicciones</button>
        <p class="mut">Al publicar quedan visibles para todo el grupo (para que nadie las repita). Podrás editarlas hasta que el organizador abra la votación.</p>`;
    } else {
      h += `<p class="mut">Tus predicciones ya son visibles para el grupo. Puedes editarlas o añadir más hasta que el organizador abra la votación.</p>`;
    }
    const others = preds.filter(p=>p.userId!==me.id && pub.has(p.userId));
    h += `<h2>👀 Ya publicadas por la familia</h2>`;
    h += others.length ? others.map(p=>`<div class="card" ${st()}><div class="who">${esc(p.userName)}</div><div class="pred">${esc(p.text)}</div></div>`).join("")
                       : `<p class="mut">Todavía nadie ha publicado. Cuando lo hagan las verás aquí para no repetirlas.</p>`;
    h += `<div class="chips">` + users.map(u=>`<span class="chip ${u.published?"done":""}" ${st()}>${u.published?"✅":"⏳"} ${esc(u.name)}</span>`).join("") + `</div>`;
  }

  /* FASE 2 */
  if(state.phase==="votacion"){
    const others = preds.filter(p=>p.userId!==me.id);
    const done = others.filter(p=>votes.some(v=>v.id===me.id+"_"+p.id)).length;
    const pct = others.length ? Math.round(done/others.length*100) : 100;
    h += `<div class="card mut" ${st()}>🔒 El plazo de predicciones está cerrado. Vota <b>Sí</b> (crees que se cumplirá) o <b>No</b> en cada predicción de los demás. Cuando el organizador cierre la votación se verá la tabla con las apuestas de cada uno.</div>`;
    h += `<h2>¿Se cumplirá? (${done}/${others.length})</h2><div class="bar"><i style="width:${pct}%"></i></div>`;
    h += `<div class="chips">` + users.map(u=>{ const t = voteStats(u); return `<span class="chip ${t.done?"done":""}" ${st()}>${t.done?"✅":"⏳"} ${esc(u.name)} ${t.got}/${t.need}</span>`; }).join("") + `</div>`;
    others.forEach(p=>{
      const v = votes.find(v=>v.id===me.id+"_"+p.id)?.vote;
      h += `<div class="card ${v===undefined?"pend":""}" ${st()}><div class="who">${esc(p.userName)}${v===undefined?' · <span style="color:var(--pink)">pendiente</span>':""}</div><div class="pred">${esc(p.text)}</div>
        <div class="row" style="margin-top:10px">
        <button class="vote yes ${v===true?"sel":""}" onclick="vote('${p.id}',true)">👍 Sí</button>
        <button class="vote no ${v===false?"sel":""}" onclick="vote('${p.id}',false)">👎 No</button></div></div>`;
    });
    if(pct===100 && others.length) h += `<div class="card" style="text-align:center">🎉 ¡Has votado todo!</div>`;
  }

  /* FASE 3 */
  if(state.phase==="cerrada"){
    h += `<div class="card" ${st()} style="text-align:center;font-size:1.05rem">🥂 Votación cerrada.<br>Nos vemos el año que viene para los resultados.</div>
      <h2>📋 Predicciones y apuestas</h2>` + matrix(false);
  }

  /* FASE 4 */
  if(state.phase==="resultados"){
    const medals = ["🥇","🥈","🥉"];
    h += `<h2>🏆 Clasificación</h2><div class="card" ${st()}>` + scores().map((s,k)=>`<div class="rank">
      <div class="pos">${medals[k]||k+1}</div>
      <div class="nm">${esc(s.name)}<div class="dt">Mías ✔${s.ownHit} ✘${s.ownMiss} · Votos ✔${s.voteHit} ✘${s.voteMiss}</div></div>
      <div class="pts">${s.total}</div></div>`).join("") + `</div>
      <p class="mut">Puntos = predicciones propias cumplidas + votos acertados.</p><h2>📋 Predicciones y apuestas</h2>` + matrix(true);
  }

  /* Administración */
  h += `<h2>⚙️ Organizador</h2>`;
  if(!isAdmin) h += `<button class="ghost" onclick="adminLogin()">Soy el organizador</button>`;
  else {
    const open = state.phase==="predicciones";
    const full = users.filter(u=>voteStats(u).done).length;
    h += `<div class="admin"><p><b>Plazo de predicciones: ${open?"🟢 abierto":"🔴 cerrado"}</b></p>
      <p class="mut">Publicaron: ${users.filter(u=>u.published).length}/${users.length}${state.phase==="votacion"||state.phase==="cerrada" ? ` · Han votado todo: ${full}/${users.length}` : ""}</p>
      <div class="row">` + (FLOW[state.phase]||[]).map((f,k)=>`<button class="${f.main?"btn":"ghost"}" onclick="goPhase(${k})">${f.label}</button>`).join("") + `</div>
      <details class="adv"><summary>Avanzado: elegir fase a mano</summary><div class="row" style="margin-top:8px">` +
      Object.entries(PHASES).map(([k,v])=>`<button class="${state.phase===k?"btn":"ghost"}" onclick="setPhase('${k}')">${v}</button>`).join("") + `</div></details></div>`;
    if(state.phase==="resultados"){
      h += `<div class="admin"><p class="mut">Marca el resultado de cada predicción</p>` +
        preds.map(p=>`<div style="margin:12px 0"><b>${esc(p.userName)}</b>: ${esc(p.text)}<div class="row">
          <button class="yes ${p.outcome===true?"sel":""}" onclick="setOutcome('${p.id}',true)">✅ Se cumplió</button>
          <button class="no ${p.outcome===false?"sel":""}" onclick="setOutcome('${p.id}',false)">❌ No</button></div></div>`).join("") + `</div>`;
    }
  }
  h += `<div style="margin-top:26px"><button class="ghost" onclick="leaveGroup()">↩ Cambiar de grupo</button></div>`;

  app.innerHTML = h;
  restore();
  if(animate && state.phase==="resultados" && !celebrated){ celebrated = true; setTimeout(()=>confetti(200), 400); }
}

subscribe();
render();
</script>
</body>
</html>
